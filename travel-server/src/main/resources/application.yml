server:
  port: 1200
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: travel-server
  # 文件上传限制（头像等）
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 8MB
  # 加载本地私有配置 application-local.yml（该文件已加入 .gitignore，不进版本库）
  profiles:
    active: local
  # 数据源（目标数据库为 MySQL；本机若无 MySQL，可在 application-local.yml 中用 H2 覆盖）
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/travel?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 开发默认 update 自动建表；生产务必设为 validate，并改用 Flyway/Liquibase 管理表结构
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# AI 对话配置
travel:
  cors:
    # 跨域允许的来源（生产环境请改为实际前端域名，逗号分隔）
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  ai:
    # 提供方：siliconflow-硅基流动真实大模型；mock-内置规则引擎（无需 Key，离线可用）
    provider: siliconflow
    siliconflow:
      # OpenAI 兼容接口地址
      base-url: https://api.siliconflow.cn/v1
      # API Key 严禁明文写入本文件（会进入 Git 历史）。
      # 方式一（推荐）：设置环境变量 SILICONFLOW_API_KEY；
      # 方式二：写入已被 gitignore 的 application-local.yml 中覆盖该项。
      api-key: ${SILICONFLOW_API_KEY:}
      # 模型 id（可在硅基流动控制台模型列表中替换为其他可用模型）
      # deepseek-ai/DeepSeek-V3：综合质量好、稳定；Qwen/Qwen2.5-7B-Instruct：免费额度小模型
      model: deepseek-ai/DeepSeek-V3
      max-tokens: 1024
      temperature: 0.7
